<header class="hdr">
  <div class="bp-container hdr__bar">
    <a class="brand" [routerLink]="l('/')" (click)="close()">
      <span class="brand__mark">✦</span>
      <span class="brand__name">Bright<span>Path</span></span>
    </a>

    <nav class="nav" [class.nav--open]="menuOpen()">
      <div class="nav__subjects">
        <a class="nav__subjects-link" [routerLink]="l('/subjects')" routerLinkActive="is-active" (click)="close()">
          {{ 'nav.subjects' | translate }} <span aria-hidden="true">⌄</span>
        </a>
        <div class="nav__subjects-pop" aria-label="Subject links">
          <a [routerLink]="l('/subjects/english')" (click)="close()">
            <i aria-hidden="true">Aa</i><span><b>English</b><small>Reading, writing &amp; grammar</small></span>
          </a>
          <a [routerLink]="l('/subjects/maths')" (click)="close()">
            <i aria-hidden="true">÷</i><span><b>Maths</b><small>Number, shape &amp; measure</small></span>
          </a>
        </div>
      </div>

      @if (isTeacher()) {
        <a class="nav__teach" [routerLink]="l('/teach')" routerLinkActive="is-active" (click)="close()">{{ 'nav.teach' | translate }}</a>
      }

      <div class="nav__auth">
        @if (user(); as u) {
          <span class="nav__who">{{ u.name }}</span>
          <button class="bp-btn bp-btn--ghost" (click)="logout(); close()">{{ 'nav.signOut' | translate }}</button>
        } @else {
          <button class="bp-btn" (click)="login(); close()">{{ 'nav.signIn' | translate }}</button>
        }
      </div>
    </nav>

    <button class="hdr__burger" (click)="toggle()" [attr.aria-expanded]="menuOpen()" aria-label="Menu">
      <span></span><span></span><span></span>
    </button>
  </div>
</header>
